<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cutverse Ai - Creative Tools Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              navy: {
                900: '#0B1120', // Deepest background
                800: '#151E32', // Card background
                700: '#2A3655', // Borders/Hover
              },
              primary: {
                DEFAULT: '#06b6d4', // Cyan 500
                hover: '#0891b2',   // Cyan 600
                glow: 'rgba(6, 182, 212, 0.5)'
              },
              accent: '#8b5cf6', // Violet
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0B1120;
        color: #e2e8f0;
      }
      .glass-card {
        background: rgba(21, 30, 50, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      /* Scanning Animation */
      @keyframes scan {
        0% { top: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }
      .scanning-line {
        position: absolute;
        left: 0;
        width: 100%;
        height: 3px;
        background: #06b6d4;
        box-shadow: 0 0 15px #06b6d4, 0 0 30px #06b6d4;
        animation: scan 2s linear infinite;
        z-index: 20;
        pointer-events: none;
      }
      .scan-overlay {
        background: linear-gradient(to bottom, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
        height: 100px;
        width: 100%;
        position: absolute;
        top: -100px; /* Moves with the line via JS or tied animation if needed, but simple line is often enough */
      }
      
      /* Custom Scrollbar for Dark Mode */
      ::-webkit-scrollbar {
        width: 8px;
        background: #0B1120;
      }
      ::-webkit-scrollbar-track {
        background: #0B1120;
      }
      ::-webkit-scrollbar-thumb {
        background: #2A3655;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #06b6d4;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@0.294.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
